<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081A24" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081A24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Долги">
<title>Долги — единое окно</title>
<style>
:root{
  --bg:#F3F1EC; --card:#FFFFFF; --card2:#F8F6F2; --text:#1B1D1C; --muted:#6F726F; --line:#E7E3DC;
  --accent:#2F6B57; --accent-soft:#E3EFE9; --warn:#C9711E; --warn-soft:#FBEEDF; --danger:#C94141; --danger-soft:#FBE6E4;
  --ok:#2F8A5B; --r:20px; --tab:#FFFFFFE8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121413; --card:#1C1F1E; --card2:#232726; --text:#F1F2F0; --muted:#9A9F9C; --line:#2C312F;
  --accent:#6FC3A3; --accent-soft:#1E3530; --warn:#F0A35C; --warn-soft:#3A2B1C; --danger:#F07C7C; --danger-soft:#3A2020; --ok:#6FC3A3; --tab:#1C1F1EE8;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35}
body{padding:env(safe-area-inset-top) 0 0}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:30px;letter-spacing:-.02em;margin:8px 0 4px;font-weight:700}
h2{font-size:20px;margin:22px 0 10px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em}
.mid{font-size:22px;font-weight:650;letter-spacing:-.01em}
.lbl{font-size:13px;color:var(--muted);text-transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.ok{background:var(--accent-soft);color:var(--accent)}
.hero{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.hero{background:#24463C}}
.hero .lbl{color:#ffffffb8}
.hero.urgent{background:#B4532A}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:600 15px var(--font);background:var(--accent);color:#fff;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--text)} .btn.ghost{background:transparent;color:var(--accent);padding:8px 0}
.btn.light{background:#ffffff26;color:#fff} .btn.danger{background:var(--danger)}
.btn.block{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.flow{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.flow .row{font-size:15px}
.sep{height:1px;background:var(--line);margin:10px 0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0} .item .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:13px;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;cursor:pointer;background:none;padding:0}
.chk.on{background:#E5A81A;border-color:#E5A81A}
.chk.on::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.done .t b{text-decoration:line-through;color:var(--muted)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font:500 10.5px var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
.tabs button.on{color:var(--accent)}
.tabs svg{width:25px;height:25px}
.alert{border-left:4px solid var(--warn)} .alert.danger{border-left-color:var(--danger)}
.sheetbg{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;font:16px var(--font);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
textarea{min-height:110px;font-size:13px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font:600 14px var(--font);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px #0001}
table.fc{width:100%;border-collapse:collapse;font-size:13.5px}
table.fc td,table.fc th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
table.fc th{color:var(--muted);font-weight:500;font-size:12px}
table.fc td:first-child,table.fc th:first-child{text-align:left}
.neg{color:var(--danger);font-weight:600} .pos{color:var(--ok)}
.gauge{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--ok) 0 50%,var(--warn) 50% 80%,var(--danger) 80% 100%);opacity:.9;margin:10px 0 4px}
.gauge i{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:var(--text);transform:translateX(-2px)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.stopbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px dashed var(--danger);background:var(--danger-soft);color:var(--danger);border-radius:var(--r);padding:14px 16px;font:600 16px var(--font);cursor:pointer;margin:10px 0}
.stopbtn small{display:block;font-weight:400;font-size:13px;opacity:.85}
.muted{color:var(--muted)}
.small{font-size:13px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:none;width:148px;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.pcard .ico{width:34px;height:34px;border-radius:11px;font-size:13px}
.pcard .amt{font-size:18px;font-weight:700;letter-spacing:-.01em}
.pcard .nm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.urgent{background:#B4532A;color:#fff}.pcard.urgent .nm{color:#ffffffc0}
.pcard.over{background:var(--danger);color:#fff}.pcard.over .nm{color:#ffffffc0}
.pcard.done{opacity:.5}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.shead h2{margin:0}
.link{color:var(--accent);font-weight:600;font-size:15px;background:none;border:0;cursor:pointer;padding:0;font-family:var(--font)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.mode{background:var(--card2);border:2px solid transparent;border-radius:16px;padding:12px 10px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode b{display:block;font-size:14px}.mode span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:5px 0}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin-top:10px}
.step .n{font-size:22px}
.edit{border-bottom:1.5px dashed currentColor;cursor:pointer}
.diff td{font-size:13.5px}
.strike{text-decoration:line-through;color:var(--muted);font-weight:400}

.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 4px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:0;background:var(--card);color:var(--text);border-radius:99px;padding:9px 16px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.chip b{font-size:15px;font-weight:600}.chip span{font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent);color:#fff}.chip.on span{color:#ffffffc8}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px}
.cd{aspect-ratio:1/1.15;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0 3px;gap:1px;font:inherit;color:inherit;cursor:pointer;min-width:0}
.cd .dn{font-size:14px;font-weight:600}
.cd .ca{font-size:9.5px;font-weight:600;line-height:1.1}
.cd .dots{display:flex;gap:2px;margin-top:auto}.cd .dots i{width:5px;height:5px;border-radius:50%}
.cd.inc{background:var(--accent-soft)}
.cd.today .dn{background:var(--text);color:var(--bg);border-radius:99px;padding:0 6px}
.cd.sel{outline:2px solid var(--accent)}
/* ===== Тёмная стеклянная тема ===== */
:root,:root{
  --bg:#06121A; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.07); --text:#E9F7F6; --muted:#8AA9AE; --line:rgba(255,255,255,.09);
  --accent:#4FE3CB; --accent-soft:rgba(79,227,203,.12); --warn:#FFC27A; --warn-soft:rgba(255,194,122,.12);
  --danger:#FF8F9E; --danger-soft:rgba(255,143,158,.12); --ok:#5BEBD2; --tab:rgba(8,22,30,.62);
  --grad:linear-gradient(135deg,#6CF5DC 0%,#33C8E6 55%,#4A86FF 100%);
  --grad-soft:linear-gradient(135deg,rgba(108,245,220,.20),rgba(51,200,230,.12) 55%,rgba(74,134,255,.18));
  --glass-border:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.04) 40%,rgba(120,240,225,.18));
  color-scheme:dark;
}
html,body{background:var(--bg)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
   radial-gradient(40% 32% at 85% 8%,rgba(64,224,200,.30),transparent 70%),
   radial-gradient(38% 30% at 5% 30%,rgba(60,130,255,.22),transparent 70%),
   radial-gradient(45% 35% at 70% 75%,rgba(40,200,220,.16),transparent 70%),
   radial-gradient(30% 25% at 15% 95%,rgba(120,255,220,.12),transparent 70%),
   #06121A;}
.card,.pcard,.chip,.mode,.stopbtn,input,select,textarea{-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.card,.pcard{position:relative;background:var(--card);box-shadow:0 10px 30px -12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.card::before,.pcard::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--glass-border);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
h1{background:linear-gradient(120deg,#F2FFFD 30%,#8FF2E2 70%,#7FB2FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:var(--grad);color:#04221F;box-shadow:0 8px 24px -10px rgba(79,227,203,.6)}
.btn.sec{background:rgba(255,255,255,.08);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.light{background:rgba(255,255,255,.16);color:#fff}
.btn.danger{background:linear-gradient(135deg,#FF9AA8,#FF6F86);color:#2A0710}
.pill{background:rgba(255,255,255,.07)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.bar{background:rgba(255,255,255,.08)} .bar>i{background:var(--grad);box-shadow:0 0 12px rgba(79,227,203,.6)}
.chk{border-color:rgba(255,255,255,.22)}
.chk.on{background:var(--grad);border-color:transparent;box-shadow:0 0 12px rgba(79,227,203,.45)}
.chk.on::after{border-color:#04221F}
.tabs{background:var(--tab);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6)}
.tabs button.on{color:var(--accent);filter:drop-shadow(0 0 8px rgba(79,227,203,.55))}
.pcard.urgent{background:linear-gradient(150deg,rgba(255,190,120,.30),rgba(255,140,110,.14));color:#FFF3E6}
.pcard.urgent .nm{color:#FFE0C2}
.pcard.over{background:linear-gradient(150deg,rgba(255,143,158,.34),rgba(255,100,130,.16));color:#fff}
.chip{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--grad);color:#04221F;box-shadow:0 6px 20px -8px rgba(79,227,203,.7)}
.chip.on span{color:#0B3B37}
.mode{background:rgba(255,255,255,.05);border-color:var(--line)}
.mode.on{background:var(--grad-soft);border-color:rgba(79,227,203,.7)}
.seg{background:rgba(255,255,255,.06)}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.step{background:var(--grad-soft);box-shadow:inset 0 0 0 1px rgba(79,227,203,.25)}
.stopbtn{background:rgba(255,255,255,.04);border:1.5px dashed rgba(143,242,226,.35);color:var(--text)}
.sheetbg{background:rgba(2,8,12,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{background:linear-gradient(180deg,rgba(14,34,42,.92),rgba(7,18,26,.96));box-shadow:0 -1px 0 rgba(255,255,255,.12),0 -20px 60px rgba(0,0,0,.5)}
.grab{background:rgba(255,255,255,.25)}
input,select,textarea{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(79,227,203,.6);box-shadow:0 0 0 3px rgba(79,227,203,.15)}
.gauge{background:linear-gradient(90deg,#5BEBD2 0 50%,#FFC27A 50% 80%,#FF8F9E 80%)}
.cd.inc{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(79,227,203,.25)}
.cd.today .dn{background:var(--grad);color:#04221F}
.cd.sel{outline-color:var(--accent)}
.ico{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px -4px rgba(0,0,0,.5)}
.toast{background:rgba(233,247,246,.92);color:#04221F}
.alert{border-left:0}
.big,.mid{letter-spacing:-.02em}
.pos{color:#6CF5DC}
table.fc td,table.fc th{border-bottom-color:var(--line)}
.item:has(+ .sep),.item:has(+ .item.empty){border-bottom:0}
.item{border-bottom-color:rgba(255,255,255,.06)}
.card .sep{margin:6px 0 10px}
#view .card:has(.chk) .item,.sheet .card:has(.chk) .item{border-bottom:0;padding:9px 0}
.chip{padding:10px 18px;flex-direction:row;align-items:center}
.chips{padding:8px 16px 20px;margin:6px -16px -8px}
.chip.on{box-shadow:0 4px 14px -6px rgba(79,227,203,.7)}
.hscroll{padding:4px 16px 18px;margin-bottom:-8px}
.card .pill + .pill{margin-left:0}
.card div[style*="gap:6px"]{gap:8px!important;flex-wrap:wrap}
.chips,.hscroll{scroll-padding-inline:16px}
/* ===== iOS 26 · Liquid Glass ===== */
:root{--lg:rgba(28,44,52,.42);--lg-hi:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05),inset 1px 0 0 rgba(255,255,255,.06),inset -1px 0 0 rgba(255,255,255,.06);--lg-sh:0 12px 34px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.25);
  --font:-apple-system,"SF Pro Display","SF Pro Text",BlinkMacSystemFont,"Inter",system-ui,sans-serif}
.wrap{padding-top:6px;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
/* навигационный слой */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.nav h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.025em;min-width:0}
.navr{display:flex;gap:8px;flex:none}
.gbtn{height:40px;padding:0 14px;border-radius:999px;border:0;display:inline-flex;align-items:center;gap:6px;font:600 14px var(--font);color:var(--text);cursor:pointer;
  background:var(--lg);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);box-shadow:var(--lg-hi),var(--lg-sh);transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.gbtn.icon{width:40px;padding:0;justify-content:center;font-size:20px;font-weight:400}
.gbtn:active,.tabs button:active,.btn:active,.chip:active{transform:scale(.94)}
.sub.date{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
/* плавающий капсульный таб-бар */
.tabs{left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;border-radius:999px;padding:6px;border:0;
  background:var(--lg);-webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);box-shadow:var(--lg-hi),var(--lg-sh)}
.tabs button{border-radius:999px;padding:6px 0 5px;gap:2px;font-size:10px;font-weight:600;transition:background .25s,transform .18s cubic-bezier(.3,1.4,.5,1)}
.tabs button.on{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);filter:none}
.tabs svg{width:24px;height:24px}
/* мягкий scroll edge effect */
body::after{content:"";position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 28px);z-index:9;pointer-events:none;background:linear-gradient(#06121Aee,#06121A00)}
.wrap::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(96px + env(safe-area-inset-bottom));z-index:5;pointer-events:none;background:linear-gradient(#06121A00,#06121Acc 70%)}
/* капсулы */
.btn{border-radius:999px;padding:14px 20px;font-size:16px}
.seg{border-radius:999px;padding:4px}
.seg button{border-radius:999px;padding:8px}
.seg button.on{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 8px rgba(0,0,0,.25)}
.card{border-radius:26px}
.pcard{border-radius:24px}
input,select,textarea{border-radius:14px}
/* шит iOS 26: парит с отступом, концентрические углы */

<body>
<div class="wrap" id="view"></div>
<nav class="tabs" id="tabs"></nav>
<div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================== Данные ================== */
const STORE_KEY='dolgi_v2';
const SEED={version:2,startTotal:null,noDebtSince:null,savedByStop:0,wishes:[],actual:{},
  income:[{id:'calc',name:'Расчёт',day:10,amount:0},{id:'adv',name:'Аванс',day:25,amount:0}],
  expenses:[],debts:[],paid:{},plan:{strategy:'avalanche',mode:'balanced',buffer:10000},fresh:true};
let S=load();
function load(){try{const r=localStorage.getItem(STORE_KEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(SEED))}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
function migrate(){
  S.debts=S.debts||[];S.expenses=S.expenses||[];S.income=S.income||[];S.paid=S.paid||{};S.actual=S.actual||{};S.spend=S.spend||[];S.wishes=S.wishes||[];
  S.plan=Object.assign({strategy:'avalanche',mode:'balanced',buffer:10000},S.plan||{});
  if(S.startTotal==null) S.startTotal=consumerTotal();
  if(S.name===undefined&&SEED.name) S.name=SEED.name;
  if(S.livingBudget==null) S.livingBudget=60000;
  if(!S.mpAdded){ if(!S.expenses.some(e=>/маркетплейс/i.test(e.name))) S.expenses.push({id:'e9',name:'Маркетплейсы',amount:0,every:1}); S.mpAdded=true; }
  if(!S.trackFrom){const n=new Date(); S.trackFrom=S.noDebtSince?S.noDebtSince.slice(0,7):n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');}
  const sf=S.expenses.find(e=>e.name==='Серфинг (5 000/нед)'); if(sf) sf.name='Серфинг';
  const t=S.debts.find(d=>d.id==='tink'); if(t&&t.color==='#2B2B2B') t.color='#FFDD2D';
  const y=S.debts.find(d=>d.id==='ya'); if(y&&y.color==='#E8B517') y.color='#1F1F23';
  save();
}
migrate();
function dataSummary(d){d=d||S;const n=(d.debts||[]).length,c=(d.expenses||[]).length,sp=(d.spend||[]).length,p=Object.keys(d.paid||{}).length;return `${n} ${plural(n,'долг','долга','долгов')} · ${c} ${plural(c,'категория','категории','категорий')} · ${sp} ${plural(sp,'расход','расхода','расходов')} · ${p} ${plural(p,'отметка','отметки','отметок')} об оплате`}
function importText(txt){const d=JSON.parse(txt.trim());if(!d||!Array.isArray(d.debts))throw new Error('bad');S=d;delete S.fresh;migrate();return dataSummary()}
async function pasteInto(id){try{const t=await navigator.clipboard.readText();document.getElementById(id).value=t;toast('Вставлено')}catch(e){toast('Не получилось — нажми в поле и выбери «Вставить»')}}

/* ================== Утилиты ================== */
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n));
const rub=n=>fmt(n)+' ₽';
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_P=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const MONTHS_D=['январю','февралю','марту','апрелю','маю','июню','июлю','августу','сентябрю','октябрю','ноябрю','декабрю'];
const MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c||1)};
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,1);
const nextKey=k=>ym(addM(parseD(k+'-01'),1));
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dateIn=(y,m,day)=>new Date(y,m,Math.min(day,dim(y,m)));
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
const mi=key=>parseD(key+'-01').getMonth();
const mLabel=key=>{const d=parseD(key+'-01');return MONTHS_N[d.getMonth()]+' '+d.getFullYear()};
const mShort=key=>{const d=parseD(key+'-01');return MS[d.getMonth()]+' ’'+String(d.getFullYear()).slice(2)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const kindName={loan:'Кредит',card:'Карта рассрочки',mortgage:'Ипотека',personal:'Личный долг'};
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}
const relDay=n=>n<0?'просрочено':n===0?'сегодня':n===1?'завтра':'через '+n+' '+plural(n,'день','дня','дней');

/* Доход и траты */
const incKey=(inc,key)=>inc.id+'|'+key;
const incomeFor=(inc,key)=>S.actual[incKey(inc,key)]!=null?S.actual[incKey(inc,key)]:+inc.amount;
const incomeMonth=key=>S.income.reduce((s,i)=>s+incomeFor(i,key),0);
const incomeMonthly=()=>S.income.reduce((s,i)=>s+ +i.amount,0);
const expActive=(e,key)=>!(e.pausedUntil&&key<e.pausedUntil);
const expAvg=e=>e.amount/(e.every||1)*(e.cut25?0.75:1);
const spentFor=(eid,key)=>(S.spend||[]).filter(x=>x.exp===eid&&x.date.slice(0,7)===key).reduce((s,x)=>s+x.amount,0);
const budget=()=>S.livingBudget!=null?S.livingBudget:60000;
const spentMonth=key=>(S.spend||[]).filter(x=>x.date.slice(0,7)===key).reduce((s,x)=>s+x.amount,0);
const livingFor=key=>key===ym(today())?Math.max(budget(),spentMonth(key)):budget();
const livingMonthly=()=>budget();

function consumerTotal(){return S.debts.filter(d=>d.kind!=='mortgage').reduce((s,d)=>s+Math.max(0,d.balance),0)}
const bankDebts=()=>S.debts.filter(d=>d.kind!=='personal'&&d.balance>0);
function activeOn(d,date){ if(d.balance<=0) return false; if(d.holidayUntil&&date<=parseD(d.holidayUntil)) return false; return true }
const interestMonthly=d=>d.balance*d.apr/100/12;

/* Периоды: расчёт 10–24, аванс 25–9 */
function periodOf(date){
  const y=date.getFullYear(),m=date.getMonth(),dd=date.getDate();
  const ci=S.income.find(i=>i.id==='calc')||S.income[0], ai=S.income.find(i=>i.id==='adv')||S.income[1];
  if(dd>=ci.day&&dd<ai.day) return {type:'calc',inc:ci,start:new Date(y,m,ci.day),end:new Date(y,m,ai.day-1)};
  if(dd>=ai.day) return {type:'adv',inc:ai,start:new Date(y,m,ai.day),end:new Date(y,m+1,ci.day-1)};
  return {type:'adv',inc:ai,start:new Date(y,m-1,ai.day),end:new Date(y,m,ci.day-1)};
}
function occurrences(from,to){
  const out=[];
  for(const d of S.debts){ if(d.kind==='personal') continue;
    let c=new Date(from.getFullYear(),from.getMonth(),1);
    while(c<=to){ const dt=dateIn(c.getFullYear(),c.getMonth(),d.day); const k=d.id+'|'+ymd(dt);
      if(dt>=from&&dt<=to&&(activeOn(d,dt)||S.paid[k])) out.push({debt:d,date:dt,key:k,amount:S.paid[k]&&S.paid[k].amt?S.paid[k].amt:Math.min(d.payment,d.balance||d.payment)});
      c=addM(c,1);} }
  return out.sort((a,b)=>a.date-b.date);
}
function personalForMonth(key){
  const out=[];
  for(const d of S.debts){ if(d.kind!=='personal') continue;
    for(const s of (d.schedule||[])) if(s.m===key&&s.a>0) out.push({debt:d,amount:s.a,key:d.id+'|'+key}); }
  return out;
}
const isPaid=k=>!!S.paid[k];
function togglePaidKey(k){
  const [id,ds]=k.split('|'); const d=S.debts.find(x=>x.id===id);
  if(S.paid[k]){ d.balance+=S.paid[k].d; delete S.paid[k]; save(); render(); return; }
  let amt, principal;
  if(d.kind==='personal'){ amt=(d.schedule.find(s=>s.m===ds)||{a:0}).a; principal=Math.min(amt,d.balance); }
  else { amt=Math.min(d.payment,d.balance||d.payment); principal=Math.max(0,Math.min(d.balance,amt-interestMonthly(d))); }
  const before=d.balance; d.balance-=principal; S.paid[k]={d:principal,amt,at:ymd(today())}; save(); render();
  afterPay(d,before,amt);
}
function upcoming(){
  const t=today(); const from=new Date(t.getFullYear(),t.getMonth()-1,1);
  let to=new Date(t.getTime()+31*864e5); let occ=occurrences(from,to);
  const unpaid=o=>!isPaid(o.key);
  if(occ.filter(o=>unpaid(o)&&o.date>=t).length<4){to=new Date(t.getTime()+62*864e5);occ=occurrences(from,to)}
  const since=parseD((S.trackFrom||ym(t))+'-01'); const overdue=occ.filter(o=>unpaid(o)&&o.date<t&&o.date>=since);
  const next=occ.filter(o=>unpaid(o)&&o.date>=t);
  const recent=occ.filter(o=>isPaid(o.key)&&S.paid[o.key].at&&dayDiff(parseD(S.paid[o.key].at),t)<=2);
  return {overdue,next,recent};
}

/* ================== Симуляция ================== */
function cloneDebts(){return S.debts.map(d=>({...d,schedule:(d.schedule||[]).map(s=>({...s}))}))}
function prepayPool(free,mode,buffer){ const avail=Math.max(0,free-buffer); const v=mode==='calm'?0:mode==='balanced'?avail*0.5:avail; return Math.floor(v/1000)*1000; }
function nper(B,P,apr){const r=apr/100/12; if(!r) return B/P; const x=1-r*B/P; return x>0?-Math.log(x)/Math.log(1+r):600}
function simulate({mode=S.plan.mode,buffer=S.plan.buffer,strategy=S.plan.strategy,addDebt=null,debts=null,months=144,livingAdj=0}={}){
  debts=(debts||cloneDebts()).map(d=>({...d,schedule:(d.schedule||[]).map(s=>({...s}))}));
  if(addDebt) debts.push(addDebt);
  for(const d of debts) if(d.prepayMode==='payment'&&d.apr>0&&d.balance>0) d.termLeft=Math.ceil(nper(d.balance,d.payment,d.apr));
  const start=new Date(today().getFullYear(),today().getMonth(),1);
  const rows=[]; let interest=0; const closed={}; let freedom=null, costly=null;
  for(let i=0;i<months;i++){
    const md=addM(start,i), key=ym(md);
    const inc=incomeMonth(key), live=Math.max(0,livingFor(key)-livingAdj);
    let mandatory=0, personal=0, prepaid=0; const pre={}, pers={}, pay_={};
    for(const d of debts){ if(d.kind==='personal'||d.balance<=0) continue;
      const pd=dateIn(md.getFullYear(),md.getMonth(),d.day);
      if(d.startKey&&key<d.startKey) continue;
      if(d.holidayUntil&&pd<=parseD(d.holidayUntil)) continue;
      const it=d.balance*d.apr/100/12; if(d.kind!=='mortgage') interest+=it; d.balance+=it;
      const pay=Math.min(d.payment,d.balance);
      if(i===0&&S.paid[d.id+'|'+ymd(pd)]){ d.balance-=it; mandatory+=pay; pay_[d.id]=pay; continue; }
      d.balance-=pay; mandatory+=pay; pay_[d.id]=pay; if(d.termLeft) d.termLeft=Math.max(1,d.termLeft-1);
      if(d.balance<=0.5){d.balance=0; closed[d.id]=closed[d.id]||key;}
    }
    for(const d of debts){ if(d.kind!=='personal'||d.balance<=0) continue;
      for(const s of d.schedule) if(s.m===key){ if(i===0&&S.paid[d.id+'|'+key]) continue; const a=Math.min(s.a,d.balance); personal+=a; pers[d.id]=(pers[d.id]||0)+a; d.balance-=a; if(d.balance<=0.5){d.balance=0;closed[d.id]=closed[d.id]||key} }
    }
    let free=inc-live-mandatory-personal;
    // остаток личных долгов без графика — из свободных, не трогая подушку
    for(const d of debts){ if(d.kind!=='personal'||d.balance<=0) continue;
      if(d.schedule.some(s=>s.m>key)) continue;
      const a=Math.min(d.balance,Math.max(0,free-buffer)); if(a<=0) continue;
      d.balance-=a; free-=a; personal+=a; pers[d.id]=(pers[d.id]||0)+a; if(d.balance<=0.5){d.balance=0;closed[d.id]=closed[d.id]||key} }
    let pool=prepayPool(free,mode,buffer);
    const order=debts.filter(d=>d.kind!=='mortgage'&&d.kind!=='personal'&&!d.noPrepay&&d.balance>0)
      .sort((a,b)=>strategy==='avalanche'?(b.apr-a.apr)||(a.balance-b.balance):(a.balance-b.balance));
    for(const d of order){ if(pool<=0) break; const a=Math.min(pool,d.balance); d.balance-=a; pool-=a; prepaid+=a; pre[d.id]=a; if(d.balance<=0.5){d.balance=0;closed[d.id]=closed[d.id]||key} else if(d.prepayMode==='payment'&&d.termLeft) d.payment=annuity(d.balance,d.apr,d.termLeft); }
    free-=prepaid;
    const left=debts.filter(d=>d.kind!=='mortgage').reduce((s,d)=>s+Math.max(0,d.balance),0);
    if(!costly&&debts.filter(d=>d.apr>=20&&d.kind!=='mortgage').every(d=>d.balance<=0)) costly=key;
    const bal={}; for(const d of debts) bal[d.id]=Math.max(0,d.balance);
    rows.push({key,inc,live,mandatory,personal,prepaid,free,left,pre,pers,pay:pay_,bal});
    if(left<=1&&!freedom) freedom=key;
    if(left<=1&&rows.length>=6) break;
  }
  return {rows,interest,closed,freedom,costly};
}
const planSim=()=>simulate();

/* Балансировщик: переносим гибкие личные платежи вперёд, пока нет дыр */
function proposeBalance(horizon=12){
  const debts=cloneDebts();
  const flex=debts.filter(d=>d.kind==='personal'&&d.canShift).sort((a,b)=>(a.shiftRank||9)-(b.shiftRank||9));
  let unresolved=[];
  for(let guard=0;guard<40;guard++){
    const sim=simulate({debts,mode:'calm'});
    const B=S.plan.buffer; const bad=sim.rows.slice(0,horizon).find(r=>r.free<B-1&&!unresolved.includes(r.key));
    if(!bad) break;
    let D=B-bad.free;
    for(const d of flex){ if(D<=0) break;
      const e=d.schedule.find(s=>s.m===bad.key&&s.a>0); if(!e) continue;
      if(S.paid[d.id+'|'+bad.key]) continue;
      const x=Math.min(D,e.a); e.a-=x; D-=x;
      const nk=nextKey(bad.key); let ne=d.schedule.find(s=>s.m===nk); if(!ne){ne={m:nk,a:0};d.schedule.push(ne)} ne.a+=x;
      d.schedule.sort((a,b)=>a.m<b.m?-1:1);
    }
    if(D>0.5) unresolved.push(bad.key);
  }
  for(const d of debts) if(d.schedule) d.schedule=d.schedule.filter(s=>s.a>0.5).map(s=>({m:s.m,a:Math.round(s.a)}));
  const sim=simulate({debts,mode:'calm'});
  const changes=[];
  for(const d of debts){ if(!d.canShift) continue; const o=S.debts.find(x=>x.id===d.id);
    const keys=[...new Set([...(o.schedule||[]).map(s=>s.m),...d.schedule.map(s=>s.m)])].sort();
    const rows=keys.map(k=>({m:k,was:((o.schedule||[]).find(s=>s.m===k)||{a:0}).a,now:(d.schedule.find(s=>s.m===k)||{a:0}).a})).filter(r=>Math.round(r.was)!==Math.round(r.now));
    if(rows.length) changes.push({debt:o,rows,schedule:d.schedule});
  }
  return {changes,unresolved:sim.rows.slice(0,horizon).filter(r=>r.free<S.plan.buffer-1),sim};
}
function deficits(n=6){return simulate({mode:'calm'}).rows.slice(0,n).filter(r=>r.free<S.plan.buffer-500)}

/* ================== Иконки и навигация ================== */
const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14l2 2 4-4"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 9.5h17M7 15h4"/></svg>',
 plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19 9.5 12l4 3.5L20 6"/><path d="M15 6h5v5"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>',
};
const TABS=[['home','Главная','home'],['pay','Платежи','cal'],['debts','Долги','list'],['plan','План','plan'],['me','Профиль','more']];
const ALLVIEWS=['home','pay','debts','plan','me'];
let tab=(location.hash||'#home').slice(1); if(!ALLVIEWS.includes(tab)) tab='home';
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1); if(ALLVIEWS.includes(t)){tab=t;render();}});
function go(t){tab=t;try{history.replaceState(null,'','#'+t)}catch(e){} render(); window.scrollTo(0,0)}
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(([id,n,ic])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')">${I[ic]}${n}</button>`).join('');
  document.getElementById('view').innerHTML=({home:vHome,pay:vPay,debts:vDebts,plan:vPlan,me:vMe}[tab])();
  const fc=document.getElementById('fullcal'); if(fc&&fc.classList.contains('open')) openCal();
}
function pdn(withHoliday){
  const inc=incomeMonthly(); let sum=0;
  for(const d of bankDebts()){ if(!withHoliday&&d.holidayUntil&&today()<=parseD(d.holidayUntil)) continue; sum+=d.payment; }
  return {pct:inc?sum/inc*100:0,sum};
}
function pdnZone(p){return p<50?['ok','Умеренная']:p<80?['warn','Высокая']:['danger','Критическая']}

/* ================== Главная ================== */
const MODES={calm:['Мягко','только по графику'],balanced:['Плавно','половина свободных'],aggressive:['Быстрее','всё сверх подушки']};
function vHome(){
  const t=today(); const per=periodOf(t); const perKey=ym(new Date(t.getFullYear(),t.getMonth()+(per.type==='adv'&&t.getDate()<10?-1:0),1));
  const occ=occurrences(per.start,per.end); const due=occ.reduce((s,o)=>s+o.amount,0);
  const paid=occ.filter(o=>isPaid(o.key)).reduce((s,o)=>s+o.amount,0);
  const got=incomeFor(per.inc,perKey); const fact=S.actual[incKey(per.inc,perKey)]!=null;
  const liveHalf=livingFor(ym(t))/2; const free=got-due-liveHalf;
  const total=consumerTotal(); const progress=Math.max(0,Math.min(1,(S.startTotal?(S.startTotal-total)/S.startTotal:0)));
  const pNow=pdn(false), pAfter=pdn(true); const [,zn]=pdnZone(pAfter.pct);
  const intM=S.debts.filter(d=>d.kind!=='mortgage').reduce((s,d)=>s+interestMonthly(d),0);
  const days=dayDiff(parseD(S.noDebtSince),t);
  const defs=deficits(6);
  const wishes=S.wishes.filter(w=>!w.done);

}

function spark(sim,sel){
  const rows=sim.rows; if(rows.length<2) return '';
  const W=320,H=84,P=4;
  const mk=vals=>{const max=Math.max(...vals,1);return vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1),P+(H-2*P-14)*(1-v/max)])};
  const path=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const tot=mk(rows.map(r=>r.left));
  const d0=sel?S.debts.find(x=>x.id===sel):null;
  const focus=d0?mk(rows.map(r=>r.bal[sel]||0)):tot;
  const col=d0?d0.color:'#6FE6EA';
  const markId=d0?sel:(topDebt()||{}).id; const mkK=sim.closed[markId]; const yi=mkK?rows.findIndex(r=>r.key===mkK):-1;
  const pct=p=>[(p[0]/W*100).toFixed(2),(p[1]/H*100).toFixed(2)];
  const md=S.debts.find(x=>x.id===markId);
  const mark=yi>=0&&md?(()=>{const [x,y]=pct(focus[yi]);return `<span class="sdot" style="left:${x}%;top:${y}%;border-color:${d0?col:'var(--accent)'}"></span>`})():'';
  const start=d0?d0.balance:consumerTotal();
  return `<div class="spark"><div class="row small"><span class="muted">${d0?esc(d0.name):'Долг без ипотеки'}</span><b>${fmt(start)} → 0 ₽</b></div><div class="small" style="margin-top:2px;color:${d0&&isLight(col)?col:'var(--accent)'}">${mkK&&md?`● ${d0?'закроешь':esc(md.name)+' закроешь'} в ${MONTHS_P[mi(mkK)]} ${mkK.slice(0,4)}`:''}</div>
  <div class="sbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="График снижения долга"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
  ${d0?`<path d="${path(tot)}" fill="none" stroke="rgba(233,247,246,.22)" stroke-width="1.5" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`:''}
  <path d="${path(focus)} L ${focus[focus.length-1][0]} ${H-14} L ${P} ${H-14} Z" fill="url(#sg)"/><path d="${path(focus)}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 6px ${col}aa)"/></svg>${mark}</div>
  <div class="row small muted" style="margin-top:2px;white-space:nowrap"><span>${mShort(rows[0].key)}</span><span>${mShort(rows[rows.length-1].key)}</span></div><div class="small muted" style="margin-top:6px;font-size:12px">${d0?'Пунктир — все долги. Нажми на долг ещё раз, чтобы вернуться к общему графику.':'Нажми на долг ниже — покажу его на графике.'}</div></div>`;
}

function stopNo(){S.savedByStop+=stopState.amount; if(stopState.wishId) S.wishes=S.wishes.filter(w=>w.id!==stopState.wishId); save();closeSheet();render();celebrate({emoji:'🛡',title:'Ты устояла!',text:`${rub(stopState.amount)} не превратились в новый долг. Это решение — настоящая забота о себе.`,stat:`Всего отказалась от ${rub(S.savedByStop)} новых долгов`,confetti:true})}
function wishDrop(id){const w=S.wishes.find(x=>x.id===id);S.savedByStop+=w.amount;S.wishes=S.wishes.filter(x=>x.id!==id);save();render();celebrate({emoji:'🛡',title:'Передумала — и это сила',text:`${rub(w.amount)} остаются твоими, а не банка.`,stat:`Всего отказалась от ${rub(S.savedByStop)} новых долгов`,confetti:true})}
function stopTake(){const s=stopState;const P=annuity(s.amount,s.apr,s.months);

function toggleCut(ix){const e=S.expenses[ix];e.cut25=!e.cut25;save();render();toast(e.cut25?'Включено в план':'Выключено')}
function moneyAdvice(){
  const base=simulate(); const key=ym(today());
  const push=S.debts.filter(d=>d.kind!=='mortgage'&&d.kind!=='personal'&&!d.noPrepay&&d.apr>0&&d.balance>0).sort((a,b)=>b.apr-a.apr);
  const tgt=push[0];
  const cuts=S.expenses.filter(e=>!e.essential).map(e=>({e,avg:e.amount/(e.every||1)})).sort((a,b)=>b.avg-a.avg);
  let h=`<h2>Если захочется ускориться</h2><div class="card"><div class="small muted" style="margin-bottom:6px">Необязательно — план и так работает. Если хочешь быстрее, включи сокращение любой гибкой траты на 25%, и план пересчитается.</div>`;
  h+=`<div class="lbl">Сократить на четверть — нажми, чтобы включить в план</div>`;
  for(const c of cuts){ const full=c.e.amount/(c.e.every||1); const cut=Math.round(full*0.25/100)*100; if(cut<=0) continue;
    let saved, earlier;
    if(c.e.cut25){ c.e.cut25=false; const w=simulate(); c.e.cut25=true; saved=Math.max(0,w.interest-base.interest); earlier=tgt&&w.closed[tgt.id]&&base.closed[tgt.id]?monthsBetween(base.closed[tgt.id],w.closed[tgt.id]):0; }
    else { const sim=simulate({livingAdj:cut}); saved=Math.max(0,base.interest-sim.interest); earlier=tgt&&base.closed[tgt.id]&&sim.closed[tgt.id]?monthsBetween(sim.closed[tgt.id],base.closed[tgt.id]):0; }
    const on=!!c.e.cut25; const paused=!expActive(c.e,key); const ix=S.expenses.indexOf(c.e);
    h+=`<div class="item" style="cursor:pointer" onclick="toggleCut(${ix})"><div class="t"><b>${esc(c.e.name)}${paused?' <span class="pill warn">пауза</span>':''}</b><span>${rub(full)} → ${rub(full-cut)}/мес · ${on?'в плане: ':'даст '}+${rub(saved)} экономии${earlier>0?`, ${esc(tgt.name)} на ${earlier} мес. раньше`:''}</span></div><span class="sw ${on?'on':''}"><i></i></span></div>`;}
  h+=`<div class="small muted" style="margin-top:6px">Включённое сокращение сразу меняет «Свободно», прогноз и дорожную карту. Выключи — всё вернётся.</div>`;
  const ess=S.expenses.filter(e=>e.essential);
  h+=`<div class="sep"></div><div class="lbl" style="margin-top:6px">🛡 Всегда остаются</div><div class="small" style="margin-top:10px;line-height:1.5">${ess.map(e=>esc(e.name)+' — '+rub(e.amount/e.every)).join(' · ')}. И подушка ${rub(S.plan.buffer)} каждый месяц.</div>`;
  return h+`</div>`;
}
function applyPrepay(id){
  const d=S.debts.find(x=>x.id===id); const a=Math.min(num(document.getElementById('ppa').value),d.balance); if(!a) return;
  const old=d.payment;
  if(d.prepayMode==='payment'&&d.apr>0){ const n=Math.ceil(nper(d.balance,d.payment,d.apr)); d.balance-=a; d.payment=d.balance>0?Math.round(annuity(d.balance,d.apr,n)):0; }
  else d.balance-=a;
  S.paid[d.id+'|pre-'+ymd(today())+'-'+Date.now()%1000]={d:a,amt:a,at:ymd(today()),pre:true};
  save();closeSheet();render();
  if(d.balance<=0.5) celebrateClose(d); else { praise('prepay',{d,a,old}); checkMilestone(); }
}

function vCal(m){
  const t=today(), y=m.getFullYear(), mo=m.getMonth(), key=ym(m), n=dim(y,mo);
  const occ=occurrences(new Date(y,mo,1),new Date(y,mo,n));
  const byDay={}; for(const o of occ){(byDay[o.date.getDate()]=byDay[o.date.getDate()]||[]).push(o)}
  const incDays={}; for(const i of S.income) incDays[Math.min(i.day,n)]=i;
  const lead=(new Date(y,mo,1).getDay()+6)%7;
  let h=`<div class="card" style="padding:14px 10px"><div class="cal">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="cw">${d}</div>`).join('')}`;
  for(let i=0;i<lead;i++) h+='<div></div>';
  for(let d=1;d<=n;d++){ const dt=new Date(y,mo,d); const list=byDay[d]||[]; const inc=incDays[d];
    const isT=+dt===+t; const sel=calDay===d; const allPaid=list.length&&list.every(o=>isPaid(o.key)); const late=list.some(o=>!isPaid(o.key)&&dt<t);
    const sum=list.reduce((s,o)=>s+o.amount,0);
    h+=`<button class="cd ${isT?'today':''} ${sel?'sel':''} ${inc?'inc':''}" onclick="setCalDay(${d})"><span class="dn">${d}</span>
      ${inc?`<span class="ca pos">+${Math.round(incomeFor(inc,key)/1000)}к</span>`:''}
      ${list.length?`<span class="ca ${late?'neg':allPaid?'muted':''}">−${sum>=1000?Math.round(sum/1000)+'к':fmt(sum)}</span><span class="dots">${list.slice(0,3).map(o=>`<i style="background:${isPaid(o.key)?'var(--line)':o.debt.color}"></i>`).join('')}</span>`:''}</button>`;}
  h+=`</div><div class="small muted" style="margin:10px 6px 0;display:flex;gap:14px;flex-wrap:wrap"><span><b class="pos">+</b> зарплата</span><span>● платёж</span><span><span class="neg">●</span> просрочен</span><span style="color:var(--muted)">● оплачен</span></div></div>`;
  const day=calDay||(t.getMonth()===mo&&t.getFullYear()===y?t.getDate():null);
  if(day){ const list=byDay[day]||[]; const inc=incDays[day];
    h+=`<h2>${day} ${MONTHS[mo]}</h2><div class="card" style="padding:6px 20px">`;
    if(inc) h+=`<div class="item"><div class="ico" style="background:var(--ok)">₽</div><div class="t" onclick="openIncome('${inc.id}','${key}')" style="cursor:pointer"><b>${inc.name}</b><span>${S.actual[incKey(inc,key)]!=null?'пришло по факту':'план · нажми, чтобы указать факт'}</span></div><b class="num pos">+${fmt(incomeFor(inc,key))}</b></div>`;
    for(const o of list){ const pd=isPaid(o.key); h+=`<div class="item ${pd?'done':''}"><button class="chk ${pd?'on':''}" onclick="togglePaidKey('${o.key}')"></button><div class="t" onclick="openPay('${o.key}')" style="cursor:pointer"><b>${esc(o.debt.name)}</b><span>${kindName[o.debt.kind]}</span></div><b class="num">${fmt(o.amount)}</b></div>`;}
    if(!inc&&!list.length) h+=`<div class="small muted" style="padding:14px 0">В этот день платежей нет</div>`;
    h+=`</div>`;}
  const pers=personalForMonth(key);
  if(pers.length){ h+=`<h2>Без даты · ${MONTHS_N[mo]}</h2><div class="card" style="padding:6px 20px">`;
    for(const o of pers){ const pd=isPaid(o.key); h+=`<div class="item ${pd?'done':''}"><button class="chk ${pd?'on':''}" onclick="togglePaidKey('${o.key}')"></button><div class="t" onclick="openPay('${o.key}')" style="cursor:pointer"><b>${esc(o.debt.name)}</b><span>${o.debt.canShift?'можно перенести':'по договорённости'}</span></div><b class="num">${fmt(o.amount)}</b></div>`;}
    h+=`</div>`;}
  return h;
}

function openDay(y,mo,d){
  const dt=new Date(y,mo,d), key=ym(dt); const list=occurrences(dt,dt); const inc=S.income.find(i=>Math.min(i.day,dim(y,mo))===d);

  if(!inc&&!list.length) h+=`<div class="small muted" style="padding:14px 0">В этот день платежей нет</div>`;
  sheet(h+`</div>`);
}

function afterPay(d,before,amt){
  if(before>0.5&&d.balance<=0.5) return celebrateClose(d);

  if(occ.length&&occ.every(o=>isPaid(o.key))){ const k='per|'+ymd(per.start); S.celebrated=S.celebrated||{}; if(!S.celebrated[k]){S.celebrated[k]=1;save();

function checkMilestone(){
  const p=S.startTotal?(S.startTotal-consumerTotal())/S.startTotal*100:0; S.celebrated=S.celebrated||{};
  for(const m of [5,10,25,50,75,90]) if(p>=m&&!S.celebrated['ms'+m]){S.celebrated['ms'+m]=1;save();

function celebrate({emoji,title,text,stat,confetti,big}){
  let m=document.getElementById('cele'); if(!m){m=document.createElement('div');m.id='cele';document.body.appendChild(m)}
  m.className='cele'+(big?' big':'');
  m.innerHTML=`<div class="celecard"><button class="sheetx" onclick="closeCele()" aria-label="Закрыть">✕</button><div class="celeemoji">${emoji}</div><h2>${title}</h2><div class="celetext">${text}</div>${stat?`<div class="celestat">${stat}</div>`:''}<button class="btn block" onclick="closeCele()">Ура!</button></div>`;
  requestAnimationFrame(()=>m.classList.add('open'));
  try{navigator.vibrate&&navigator.vibrate(big?[30,40,60]:25)}catch(e){}
  if(confetti&&!matchMedia('(prefers-reduced-motion: reduce)').matches) confettiBurst(big?220:120);
}
function closeCele(){const m=document.getElementById('cele'); if(m) m.classList.remove('open')}
function confettiBurst(n){
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio; const ctx=c.getContext('2d');
  const cols=['#6FE6EA','#55DCE3','#6BE3C9','#FFD98A','#F4C27F','#FFFFFF','#8FB8FF'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.2,y:H*.42,vx:(Math.random()-.5)*W*.022,vy:-(Math.random()*H*.02+H*.006),r:(Math.random()*6+4)*devicePixelRatio,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3,s:Math.random()<.5}));
  const t0=performance.now();
  (function f(t){const el=t-t0; ctx.clearRect(0,0,W,H);
    for(const p of ps){p.vy+=H*.00045;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,1-el/2800);ctx.fillStyle=p.c;
      if(p.s)ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{ctx.beginPath();ctx.arc(0,0,p.r/2.6,0,7);ctx.fill()}ctx.restore()}
    if(el<2900)requestAnimationFrame(f);else c.remove()})(t0);
}

/* ===== Календарь (.ics) ===== */
function icsExport(){
  const pad=n=>String(n).padStart(2,'0'); const t=today(); const stamp=t.getFullYear()+pad(t.getMonth()+1)+pad(t.getDate())+'T090000';
  let ev='';
  for(const d of S.debts){ if(d.kind==='personal'||d.balance<=0) continue;
    let st=new Date(t.getFullYear(),t.getMonth(),Math.min(d.day,28)); if(st<t) st=new Date(t.getFullYear(),t.getMonth()+1,Math.min(d.day,28));
    if(d.holidayUntil&&st<=parseD(d.holidayUntil)){const h=parseD(d.holidayUntil);st=new Date(h.getFullYear(),h.getMonth(),Math.min(d.day,28));if(st<=h)st=new Date(h.getFullYear(),h.getMonth()+1,Math.min(d.day,28));}
    const ds=st.getFullYear()+pad(st.getMonth()+1)+pad(st.getDate());
    ev+=`BEGIN:VEVENT\r\nUID:${d.id}-${ds}@dolgi\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${ds}\r\nRRULE:FREQ=MONTHLY;BYMONTHDAY=${Math.min(d.day,28)}\r\nSUMMARY:Платёж: ${d.name} — ${fmt(d.payment)} ₽\r\nBEGIN:VALARM\r\nTRIGGER:-P2D\r\nACTION:DISPLAY\r\nDESCRIPTION:Через 2 дня платёж ${d.name}\r\nEND:VALARM\r\nBEGIN:VALARM\r\nTRIGGER:PT10H\r\nACTION:DISPLAY\r\nDESCRIPTION:Сегодня платёж ${d.name}\r\nEND:VALARM\r\nEND:VEVENT\r\n`;}
  for(const i of S.income){ ev+=`BEGIN:VEVENT\r\nUID:inc-${i.id}@dolgi\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${t.getFullYear()}${pad(t.getMonth()+1)}${pad(i.day)}\r\nRRULE:FREQ=MONTHLY;BYMONTHDAY=${i.day}\r\nSUMMARY:${i.name} — отметь, сколько пришло\r\nEND:VEVENT\r\n`;}
  const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Dolgi//RU\r\nCALSCALE:GREGORIAN\r\n${ev}END:VCALENDAR\r\n`;
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  const a=document.createElement('a');a.href=url;a.download='platezhi.ics';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000); toast('Открой файл — платежи добавятся в Календарь');
}
